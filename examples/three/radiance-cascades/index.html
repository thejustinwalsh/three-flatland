<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiance Cascades - Three.js</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111418;
      }
      canvas {
        display: block;
        transform: translateZ(0);
        will-change: transform;
        isolation: isolate;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #d7dde6;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status">booting</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
