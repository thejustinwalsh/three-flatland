packages:
  - packages/*
  - packages/create-three-flatland/templates/*
  - examples/**
  - benchmarks/*
  - minis/*
  - docs
  - skills
  - tools/*

onlyBuiltDependencies:
  - esbuild
  - sharp

peerDependencyRules:
  allowedVersions:
    'vitefu>vite': ^8.1.5

overrides:
  three-flatland: workspace:*
  '@three-flatland/bake': workspace:*
  '@three-flatland/image': workspace:*
  '@three-flatland/nodes': workspace:*
  '@three-flatland/presets': workspace:*
  '@three-flatland/schemas': workspace:*
  '@three-flatland/skia': workspace:*
  '@three-flatland/skills': workspace:*
  '@three-flatland/slug': workspace:*
  '@three-flatland/devtools': workspace:*
  yaml: ^2.8.4
  'minimatch@<3.1.4': '>=3.1.4 <4'
  'minimatch@>=9.0.0 <9.0.7': '>=9.0.7 <10'
  'rollup@>=4.0.0 <4.59.0': '>=4.59.0 <5'
  'ajv@<6.14.0': '>=6.14.0 <7'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '>=8.18.0 <9'
  'flatted@<=3.4.1': '>=3.4.2 <4'
  'smol-toml@<1.6.1': '>=1.6.1 <2'
  'brace-expansion@<1.1.18': '>=1.1.18 <2'
  'brace-expansion@>=2.0.0 <2.1.4': '>=2.1.4 <3'
  'brace-expansion@>=3.0.0 <3.0.6': '>=3.0.6 <4'
  # No patched 4.x release exists; the security fix requires 5.0.9.
  'brace-expansion@>=4.0.0 <5.0.0': '>=5.0.9 <6'
  'brace-expansion@>=5.0.0 <5.0.9': '>=5.0.9 <6'
  'picomatch@<2.3.2': '>=2.3.2 <3'
  # No patched 1.x release exists; the security fix requires 2.4.4.
  'fast-uri@<2.0.0': '>=2.4.4 <3'
  'fast-uri@>=2.0.0 <2.4.4': '>=2.4.4 <3'
  'fast-uri@>=3.0.0 <3.1.5': '>=3.1.5 <4'
  'fast-uri@>=4.0.0 <4.1.2': '>=4.1.2 <5'
  'nanoid@<3.3.18': '>=3.3.18 <4'
  # No patched 4.x release exists; the security fix requires 5.1.16.
  'nanoid@>=4.0.0 <5.0.0': '>=5.1.16 <6'
  'nanoid@>=5.0.0 <5.1.16': '>=5.1.16 <6'
  'postcss@<=8.5.22': '>=8.5.23 <9'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1 <0.29'
  '@babel/core@<=7.29.0': '>=7.29.6 <8'
  'markdown-it@<=14.1.1': '>=14.2.0 <15'
  'linkify-it@<=5.0.0': '>=5.0.1 <6'
  'js-yaml@<3.15.1': '>=3.15.1 <4'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1 <5'
  '@zkochan/js-yaml': 'npm:js-yaml@4.3.1'
  # No patched 5.x release exists; the security fix requires 6.28.0.
  'undici@<6.0.0': '>=6.28.0 <7'
  'undici@>=6.0.0 <6.28.0': '>=6.28.0 <7'
  'undici@>=7.0.0 <7.29.0': '>=7.29.0 <8'
  'undici@>=8.0.0 <8.9.0': '>=8.9.0 <9'
  vite: ^7.3.6
  'astro>vite': ^8.0.13
  '@astrojs/starlight': ^0.41.3
  qs: ^6.15.3
  uuid: ^11.1.1
  'axios@<1.18.0': '>=1.18.0 <2'
  'shell-quote@<1.9.0': '>=1.9.0 <2'
  'svgo@>=4.0.0 <4.0.2': '>=4.0.2 <5'
  'sharp@<0.35.0': '>=0.35.0 <0.36'

catalog:
  '@jsquash/avif': ^2.1.1
  '@jsquash/png': ^3.1.1
  '@jsquash/webp': ^1.5.0
  '@three-flatland/devtools': ^1.0.0-alpha.6
  '@tweakpane/core': ^2.0.5
  '@tweakpane/plugin-essentials': ^0.2.1
  tweakpane: ^4.0.5
  # Audio engine. zzfx is the synth (one-shot 21-param arrays for SFX);
  # @zzfx-studio/zzfxm is the music sequencer (4-channel patterns), which
  # peer-deps zzfx. pnpm resolves both to a single zzfx install so the
  # synth engine is shared across SFX + music — no duplicate bundle weight.
  # The audio engine lives in docs/src/audio/ and is dynamically imported
  # (NOT in the main bundle); the minis import zzfx directly for standalone
  # playback.
  '@zzfx-studio/zzfxm': ^0.1.5
  zzfx: ^1.3.2
  # Real Web Audio in Node (napi-rs/Rust/cpal) — tools/audio-play's inline
  # (no-panel) sidecar's AudioContext, a separate Node-only consumer from
  # the browser audio engine above (native napi module, not resolved into
  # the same install). Ships ALL platform .node binaries in the one
  # package (5-7MB each); VSIX packaging strips unused platforms (#24).
  node-web-audio-api: ^2.0.0
  # tools/audio-play's Tone/Wad synth findings (#47) — versions pinned
  # exactly (no caret) to the prototype-gate-validated versions, not a
  # semver range, since the gate's findings (Tone.setContext behavior,
  # Wad's private-AudioContext monkey-patch ordering) were verified
  # against these specific builds.
  tone: 15.1.22
  web-audio-daw: 4.13.4
  # Keep prereleases exact: a caret range can resolve R3F canaries with a
  # different three/webgpu compatibility floor.
  '@react-three/fiber': 10.0.0-alpha.3
  '@stylexjs/stylex': ^0.18.3
  '@stylexjs/unplugin': ^0.18.3
  '@types/pngjs': ^6.0.5
  '@types/node': ^22.10.5
  '@types/react': ^19.0.2
  '@types/react-dom': ^19.0.2
  '@types/three': ^0.185.4
  '@webgpu/types': ^0.1.72
  '@vitejs/plugin-react': ^4.3.4
  koota: ^0.6.5
  pngjs: ^7.0.0
  react: ~19.2.0
  react-dom: ~19.2.0
  three: ^0.185.1
  typescript: ^5.7.3
  uwasi: ^1.4.1
  vite: ^7.3.6
  '@gltf-transform/core': ^4.3.0
  zundo: ^2.3.0
  zustand: ^5.0.0
  ts-json-schema-generator: ^2.9.0
  # JSON Schema validator — packages/schemas runtime dep (Ajv 2020 dialect).
  ajv: ^8.17.1
